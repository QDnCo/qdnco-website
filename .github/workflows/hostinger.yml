name: Website CI and Hostinger deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qdnco-production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check React source build (not the production deployment source)
        run: npm run build
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Package canonical production site
        run: python3 ci/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-site
          path: |
            release/
            release-manifest.json
          include-hidden-files: true
          retention-days: 14
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://qdnco.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: production-site
      - name: Refuse a superseded main commit
        run: |
          current=$(git ls-remote https://github.com/QDnCo/qdnco-website.git refs/heads/main | cut -f1)
          test "$current" = "$GITHUB_SHA"
      - name: Deploy and verify Hostinger production
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: python3 ci/deploy.py
