const { motion, useScroll, useTransform } = window.Motion;

/* ── FadeIn ── */
function FadeIn({ children, delay = 0, duration = 0.7, x = 0, y = 30, as = 'div', className, style }) {
  const M = motion[as] || motion.div;
  return (
    <M
      className={className} style={style}
      initial={{ opacity: 0, x, y }}
      whileInView={{ opacity: 1, x: 0, y: 0 }}
      viewport={{ once: true, margin: '50px', amount: 0 }}
      transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
    >{children}</M>
  );
}

/* ── Magnet ── */
function Magnet({ children, padding = 150, strength = 3, className, style }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const [active, setActive] = useState(false);
  useEffect(() => {
    const onMove = (e) => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      if (Math.abs(dx) < r.width / 2 + padding && Math.abs(dy) < r.height / 2 + padding) {
        setActive(true); setPos({ x: dx / strength, y: dy / strength });
      } else { setActive(false); setPos({ x: 0, y: 0 }); }
    };
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, [padding, strength]);
  return (
    <div ref={ref} className={className} style={style}>
      <div style={{
        transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`,
        transition: active ? 'transform 0.3s ease-out' : 'transform 0.6s ease-in-out',
        willChange: 'transform'
      }}>{children}</div>
    </div>
  );
}

/* ── AnimatedText ── */
function AnimatedText({ text, className, style }) {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start 0.8', 'end 0.2'] });
  const chars = text.split('');
  return (
    <p ref={ref} className={className} style={style}>
      {chars.map((c, i) => {
        const start = i / chars.length, end = start + 1 / chars.length;
        const opacity = useTransform(scrollYProgress, [start, end], [0.2, 1]);
        return <motion.span key={i} style={{ opacity }}>{c === ' ' ? ' ' : c}</motion.span>;
      })}
    </p>
  );
}

function MarqueeSection() {
  const ref = useRef(null);
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const el = ref.current; if (!el) return;
      const top = el.getBoundingClientRect().top + window.scrollY;
      setOffset((window.scrollY - top + window.innerHeight) * 0.3);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const r1 = [...GIFS.slice(0, 11), ...GIFS.slice(0, 11), ...GIFS.slice(0, 11)];
  const r2 = [...GIFS.slice(11), ...GIFS.slice(11), ...GIFS.slice(11)];

    <img src={src} loading="lazy" className="rounded-2xl object-cover shrink-0" style={{ width: 420, height: 270 }} />
  );

  return (
    <section ref={ref} className="pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden flex flex-col gap-3" style={{ background: '#0C0C0C' }}>
      <div className="flex gap-3 w-max" style={{ transform: `translateX(${offset - 200}px)`, willChange: 'transform' }}>
        {r1.map((s, i) => <Tile key={i} src={s} />)}
      </div>
      <div className="flex gap-3 w-max" style={{ transform: `translateX(${-(offset - 200)}px)`, willChange: 'transform' }}>
        {r2.map((s, i) => <Tile key={i} src={s} />)}

    </section>
  );
}
