    .roadmap-copy > div:first-child { gap: 0.4rem; }
    /* The pinned frame is exactly the viewport, so the section's own bottom
       padding has nowhere to go but into the content. */
    .roadmap-copy { padding-bottom: 0; }
    /* --chrome-clear already clears the 109px mobile bar with room to spare.
       The extra breathing gap stacked on top of it is a desktop nicety, and on
       a phone it is the last 9px the copy column needs. !important because the
       padding is an inline style from JSX and nothing else can reach it. */
    #roadmap > .sticky { padding-top: var(--chrome-clear) !important; }
  }

  @media (prefers-reduced-motion: reduce) { .platform-track { animation: none; } }

  /* ── Roadmap: the construction scene ──
     The SVG carries all the geometry and colour; the stylesheet only sizes the
     stage and styles the pre/post-launch toggle. */
  .site-stage {
    position: relative;
    width: 100%;
    /* Bounded on both axes. The previous stage sized only by height and let the
       SVG overflow, which is how the model ended up hanging below the fold. */
    height: min(58vh, 470px);
    min-height: 240px;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  /* meet-fitted against a viewBox that contains the world extents, so the whole
     build is inside the frame at any stage size rather than relying on the
     numbers happening to line up. */
  .site-svg { width: 100%; height: 100%; display: block; overflow: hidden; }

  .site-toggle {
    display: inline-flex;
    padding: 3px;
    border-radius: 999px;
    background: rgba(var(--fill-rgb),0.1);
    border: 1px solid rgba(var(--ink-rgb),0.2);
  }
  .site-toggle button {
    appearance: none; border: 0; cursor: pointer;
    background: transparent;
    color: rgba(var(--ink-rgb),0.7);
    font-family: 'Barlow', sans-serif; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    font-size: clamp(0.75rem, 0.88vw, 0.84rem);
    padding: 0.5rem 0.95rem; min-height: 38px;
    border-radius: 999px;
    transition: background 220ms ease, color 220ms ease;
  }
  .site-toggle button.is-on { background: var(--ink); color: var(--page); }

  @media (max-width: 767px) {
    .site-stage { height: min(34vh, 260px); }
  }

  .intro-signoff { display: flex; flex-direction: column; }

  /* The typed line and its hidden full-length twin occupy the same grid cell,
     so the paragraph is always as tall as the finished sentence. */
  .intro-statement { display: grid; }
  .intro-statement > .tw-reserve,
  .intro-statement > .tw-live { grid-area: 1 / 1; }
  .tw-reserve { visibility: hidden; pointer-events: none; }
  .intro-sign-wrap {
    margin-top: clamp(0.5rem, 1.6vh, 1.1rem);
    margin-left: clamp(1.5rem, 9vw, 8rem);
    width: clamp(140px, 17vw, 250px);
    min-height: clamp(56px, 6.9vw, 101px);
  }
  .intro-sign { display: block; overflow: visible; }

  @media (max-width: 767px) {
    /* On a phone the band is the tightest space on the page, so the mark drops
       a size and tucks closer under the line rather than stepping out to the
       right — there is no room for the diagonal. */
    .intro-sign-wrap {
      margin-left: clamp(0.75rem, 6vw, 2.5rem);
      width: clamp(118px, 34vw, 150px);
      min-height: clamp(48px, 13.7vw, 61px);
    }
  }

  /* Dark mode only. The cutout's lower edge is a hard horizontal cut where the
     photograph was cropped, which reads as a pasted-on sticker against the
     page. A mask fades the bottom eighth to nothing so it dissolves into the
     ground instead. A gradient overlay would have done the same job only while
     the page colour behind it stayed constant — the wallpaper moves, so the
     fade has to be cut out of the figure rather than painted over it. */
  .intro-fig-fade {
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 84%, rgba(0,0,0,0.55) 93%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 84%, rgba(0,0,0,0.55) 93%, transparent 100%);
  }

  /* The statement shares the bottom band with the figure, and the figure just
     grew into it. Two independent guards, because either one alone still fails:
     the width cap keeps the line from reaching the cutout at all, and the halo
     keeps it readable in the overlap a narrow-but-not-mobile viewport can still
     force. Light mode was the visible symptom — black type over a black suit
     swallowed the word "ADS" entirely — but the same collision exists in dark
     mode with the polarity reversed, so both get the treatment.

     The halo is painted in --page, so it is white behind black type on the
     white ground and black behind white type on the dark one, from a single
     declaration. Eight offsets rather than four: at this weight the diagonal
     gaps in a four-point ring are wide enough to see through. */
  .intro-statement {
    text-shadow:
      0 0 12px var(--page),
      1.5px 0 0 var(--page), -1.5px 0 0 var(--page),
      0 1.5px 0 var(--page), 0 -1.5px 0 var(--page),
      1.1px 1.1px 0 var(--page), -1.1px 1.1px 0 var(--page),
      1.1px -1.1px 0 var(--page), -1.1px -1.1px 0 var(--page);
  }

  /* Ends before the cutout begins, less a clear gutter. Below md the figure is
     centred above the statement rather than beside it, so there is nothing to
     avoid and the cap would only starve the line — hence the media query.

     Deliberately expressed against the figure's WIDEST permitted width (40vw,
     so its left edge is never nearer than 30vw) rather than against --fig-w
     itself. Reading the live width would close a loop: --fig-w sets this cap,
     the cap changes how many lines the statement wraps to, the line count
     changes the band height, and the band height is what --fig-w is measured
     from. A static bound clears the figure at every size and cannot oscillate.

     Doubled selector: max-w-[22ch] is Tailwind's, same specificity, later. */
  @media (min-width: 768px) {
    .intro-signoff { max-width: min(30ch, calc(30vw - 100px)); }
    .intro-statement.intro-statement { max-width: min(22ch, calc(30vw - 160px)); }
  }

  /* Short phones — a 667px screen has to fit the ticker, a three-line headline,
     a paragraph, two buttons, two stat cards and the client row. At the default
     sizes that stack was taller than the viewport, so the centred column spilled
     upward and the headline printed straight over the live ticker.

     !important is unavoidable here: these values are set as inline styles from
     JSX, and an inline style beats any selector. The alternative was to thread a
     viewport-height branch through the component, which puts layout rules in
     two places. */
  @media (max-width: 767px) and (max-height: 720px) {
    .hero-stack.hero-stack { row-gap: 0.75rem !important; padding-top: 0.55rem !important; }
    .hero-ticker.hero-ticker { padding-top: calc(var(--chrome-clear) + 0.35rem) !important; }
    .hero-stack.hero-stack h1,
    .hero-dark-h1 { font-size: 2.05rem !important; }
    .hero-stack.hero-stack > p,
    .hero-dark-sub { font-size: 0.88rem !important; line-height: 1.4 !important; }
    .hero-proof.hero-proof {
      gap: 0.6rem 1.5rem !important;
      row-gap: 0.6rem !important;
    }
    .hero-proof.hero-proof span[class*="font-heading"] { font-size: 1.95rem !important; }
    .hero-proof.hero-proof span[class*="font-body"] { font-size: 0.75rem !important; }
  }

  /* Phone hero locks — light + dark. Laptop/desktop unchanged. */
  @media (max-width: 767px) {

  /* ── Touch hit areas ──

     fold by a small margin. So the hit area is expanded with a centred

     grows, but the finger gets a 44px target. Desktop is untouched — this only

ge": "en-IN"}, {"@type": "WebPage", "@id": "https://qdnco.com/#webpage", "url": "https://qdnco.com/", "name": "Real Estate Performance Marketing Agency in Bangalore | QDnCo", "description": "Performance marketing for real estate developers, channel partners and builders in Bangalore, Mysore and across Karnataka. Research-led Meta and Google Ads for crore-ticket apartment, villa and plotted-development launches.", "isPartOf": {"@id": "https://qdnco.com/#website"}, "about": {"@id": "https://qdnco.com/#organization"}, "inLanguage": "en-IN", "datePublished": "2026-08-01", "dateModified": "2026-08-06"}, {"@type": "FAQPage", "@id": "https://qdnco.com/#faq", "isPartOf": {"@id": "https://qdnco.com/#webpage"}, "mainEntity": [{"@type": "Question", "name": "How do you market a real estate project in Bangalore?", "acceptedAnswer": {"@type": "Answer", "text": "A launch is planned before it is bought. The sequence is: a business questionnaire, then three parallel research tracks — primary interviews with the actual buyer, secondary desk research covering total addressable market, competitive landscape, pricing and unit economics, and historical study of what has already worked or failed for the brand. Only then does campaign architecture get built across Meta and Google, split into top, middle and bottom of funnel with a separate retargeting layer. Spend scales only after cost per qualified lead and lead quality hold for a full test window."}}, {"@type": "Question", "name": "What is a good cost per lead for real estate in Bangalore?", "acceptedAnswer": {"@type": "Answer", "text": "It depends entirely on ticket size, and cost per lead on its own is a misleading number. On a premium North Bangalore residential project we ran leads at ₹266 with 51% qualifying as sales-ready. The historical enterprise-portfolio account reports around ₹450 per lead and about 22,000 monthly leads; these figures describe portfolio context, not a result for each project. A ₹200 lead that never books a site visit is more expensive than a ₹600 lead that does — measure cost per site visit and cost per booking, not cost per form fill."}}, {"@type": "Question", "name": "How much should a developer spend on digital marketing for a launch?", "acceptedAnswer": {"@type": "Answer", "text": "Enough to buy a real answer, then more only once the answer is good. A controlled test in the low lakhs establishes cost per lead, lead quality and channel mix. Once those hold, monthly media typically runs ₹4–6 lakh for a single project and can reach ₹1 crore a month across a portfolio. What matters is that the budget scales against proven unit economics rather than against a media plan written before anyone talked to a buyer."}}, {"@type": "Question", "name": "What is the difference between leads and qualified site visits?", "acceptedAnswer": {"@type": "Answer", "text": "A lead is a form fill. A qualified site visit is a buyer who arrives at the project with intent and budget. Most agencies report the first because it is easy to produce cheaply. Sales teams only care about the second. Every campaign should be scored against sales feedback, with lead quality tracked weekly and creative or targeting killed when the sales-ready percentage falls."}}, {"@type": "Question", "name": "What exactly counts as a qualified lead?", "acceptedAnswer": {"@type": "Answer", "text": "It is defined in the contract, not left to interpretation. A qualified lead meets all five conditions: contactable — answers by phone or WhatsApp within three attempts over 48 hours; budget-matched — states a budget inside the project's price band; intent-dated — states a purchase timeline of six months or less; geography-valid — buying in, or relocating to, the project's catchment; and not a duplicate — not already in your CRM within 90 days. Any lead that fails the definition is replaced free if you flag it within seven days. Call recordings and CRM status are the shared evidence, so neither side is arguing from memory. Most agencies will not write this down, which is exactly why lead quality is the thing developers complain about most."}}, {"@type": "Question", "name": "Who pays for the ad spend — you or us?", "acceptedAnswer": {"@type": "Answer", "text": "You do, directly to Meta and Google. The ad account stays in your name and the media invoice comes to you, never through us. Three reasons. It keeps you as the advertiser of record, which matters under RERA because the promoter — not the agency — is responsible for what a project advertisement claims. It means media inflation is visible to you rather than buried in a bundled unit price. And it makes the efficiency provable: when cost per lead falls, your own invoice shows it. Our fee is separate and covers the work, not the media."}}, {"@type": "Question", "name": "How does this compare to what a channel partner costs?", "acceptedAnswer": {"@type": "Answer", "text": "Channel partners in India typically take one to three percent of transaction value, sometimes up to five. On a ₹1 crore unit that is ₹1 lakh to ₹3 lakh per booking, paid on success. Working from delivered numbers — ₹266 per lead at 51% sales-ready, plus a ₹550 fee per qualified lead — the all-in cost lands near ₹10,700 per booking influenced at a conservative ten percent qualified-lead-to-booking rate. That is roughly nine to twenty-eight times cheaper. The honest caveat: a channel partner brings a buyer and closes them, while we bring a qualified buyer to your own sales team. The comparison is fair on demand generation, not on closing."}}, {"@type": "Question", "name": "Do you work with channel partners and brokers as well as developers?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Channel-partner and broker demand is run as its own pool with separate creative, separate targeting and separate reporting, because a broker responds to entirely different messaging than an end buyer. Mixing the two into one campaign is one of the most common reasons real estate media spend underperforms."}}, {"@type": "Question", "name": "Which platforms work best for selling apartments and plots?", "acceptedAnswer": {"@type": "Answer", "text": "Meta and Google carry most of the volume for Indian residential real estate — Meta for discovery and creative-led demand, Google for high-intent search around micro-market and project name queries. LinkedIn works for premium and NRI segments. X, Snapchat, ChatGPT Ads and Jio Ads are used selectively where the buyer profile justifies them. Platform choice comes out of the research, not out of habit."}}, {"@type": "Question", "name": "How is plotted development marketing different from apartment marketing?", "acceptedAnswer": {"@type": "Answer", "text": "A land buyer behaves nothing like an apartment buyer. Plot purchases are driven by appreciation, approval status and clear title far more than by amenities or floor plans, and the consideration window is longer. Creative leads with authority approval, location corridor and per-square-foot economics rather than lifestyle imagery, and the funnel is built to nurture across a longer decision period."}}, {"@type": "Question", "name": "What does RERA compliance mean for real estate advertising?", "acceptedAnswer": {"@type": "Answer", "text": "Every advertisement for a registered project must carry the RERA registration number and must not make claims the registration does not support — no guaranteed returns, no amenities absent from the sanctioned plan, no possession dates that contradict the filing. Campaigns are built compliant from the creative brief onward rather than corrected after a notice."}}, {"@type": "Question", "name": "How long does it take to see results from real estate performance marketing?", "acceptedAnswer": {"@type": "Answer", "text": "You are live in market from roughly week six. Phases zero through two — questionnaire, research and campaign architecture — take about five to six weeks. Phase three is a month of live A/B testing that produces the scale playbook. By month three the funnel, CRM routing and weekly dashboard are running and the system is repeatable."}}, {"@type": "Question", "name": "What reporting do you provide?", "acceptedAnswer": {"@type": "Answer", "text": "A weekly client dashboard plus weekly reporting covering spend, cost per lead, lead quality, sales-ready percentage, site visits, campaign architecture, creative approvals and every budget scaling decision. Absolute transparency — no black box, and no metric that cannot be traced back to a source."}}, {"@type": "Question", "name": "Do you handle CRM and lead routing as well as ads?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Real-time CRM routing and alerts through HubSpot or Zoho, GA4 and Google Tag Manager implementation, Meta Pixel and conversion tracking, and process alignment with the sales or CIS team. Leads that sit unattended for hours are the fastest way to waste good media spend."}}, {"@type": "Question", "name": "Which areas do you serve?", "acceptedAnswer": {"@type": "Answer", "text": "Bangalore and Mysore primarily, and across Karnataka. Delivered launches include projects on Kanakapura Road, Nagasandra and the Tumkur Road metro corridor, Budigere Cross, Yeshwanthpur, Devanahalli and the airport corridor, North Bangalore, and R.T. Nagar in Mysore. Education and SaaS clients are served across India."}}, {"@type": "Question", "name": "Do you charge extra for more ad creatives?", "acceptedAnswer": {"@type": "Answer", "text": "No. Every performance package includes fifteen static AI-generated ad creatives per month, plus AI ad copy written against the research brief. When creatives fatigue or demand shifts, we regenerate more AI assets without a separate creative invoice. Studio production — professional shoot and edit, videographers, drone, UGC and IGC, motion graphics — remains a separate package, quoted per project and approved before commissioning. The ad reel shows the pipeline grade we can produce; the commercial offer is fifteen included statics a month, refreshed as needed."}}, {"@type": "Question", "name": "How is this different from a traditional creative agency?", "acceptedAnswer": {"@type": "Answer", "text": "A traditional studio prices shoot days, editors, talent and revisions. That is the right model for film, drone and creator work — which we still offer as a separate package. It is the wrong cost structure for finding which hooks a Bangalore buyer answers. Our AI pipelines let us refresh included creatives on fatigue without billing each asset, gated by research and strategy. Full comparison: guides/ai-creative-volume-vs-traditional-agency.html."}}]}, {"@type": "ItemList", "@id": "https://qdnco.com/#projects", "name": "Delivered projects", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Indium Group", "item": {"@type": "CreativeWork", "name": "Indium Group", "about": "Premium residential launch, North Bangalore"}}, {"@type": "ListItem", "position": 2, "name": "Brigade Jeevan Sandya", "item": {"@type": "CreativeWork", "name": "Brigade Jeevan Sandya", "about": "133-unit residential launch, Kanakapura Road"}}, {"@type": "ListItem", "position": 3, "name": "Kumar Platina", "item": {"@type": "CreativeWork", "name": "Kumar Platina", "about": "184-unit RERA-approved launch, Nagasandra metro corridor"}}, {"@type": "ListItem", "position": 4, "name": "Vaishnavi Life", "item": {"@type": "CreativeWork", "name": "Vaishnavi Life", "about": "45-acre, 598-plot MUDA-approved plotted development, R.T. Nagar Mysore"}}, {"@type": "ListItem", "position": 5, "name": "Godrej Woodscapes", "item": {"@type": "CreativeWork", "name": "Godrej Woodscapes", "about": "Large-format residential, Budigere Cross"}}, {"@type": "ListItem", "position": 6, "name": "Godrej Tiara", "item": {"@type": "CreativeWork", "name": "Godrej Tiara", "about": "Luxury 4.5 BHK, Yeshwanthpur"}}, {"@type": "ListItem", "position": 7, "name": "Godrej MSR City", "item": {"@type": "CreativeWork", "n /**
 * `plate` renders the logo in its real brand colours on a light chip. Most of
 * these marks are dark ink (Godrej is #141414, Kumar and LogicLaunch are dark
 * blues) so they would disappear if dropped straight onto the dark page —
 * the chip is what lets true brand colour show instead of a white silhouette.
 */
function BrandMark({ b, h = 34, ink = false, plate: wantPlate = false, lockTier = false }) {
  const [failed, setFailed] = useState(false);
  /* darkLockup brands ship separate ink + white cuts. Always allow the light
     chip; never put the white cut on a light chip (wordmark would vanish and
     leave only a fragment of the tick). */
  const plate = wantPlate;
  const scale = b.scale || 1;
  const hPx = lockTier ? null : h;
  const boxH = lockTier ? `calc(var(--brand-mark-h) * ${scale})` : h * scale;
  const boxW = lockTier ? `calc(var(--brand-mark-h) * ${scale} * ${b.ar})` : h * scale * b.ar;
  const wordSize = (hPx || 34) * 0.46;

  if (!b.logo || failed) {
    const word = (
      <span className="font-kanit font-semibold uppercase whitespace-nowrap"
            style={{ color: plate || ink ? '#0A0D12' : 'var(--ink-body)', fontSize: wordSize, letterSpacing: '0.08em' }}>
        {b.name}
      </span>
    );
    if (!plate) return word;
    return (
      <span className="inline-flex items-center rounded-lg" style={{ background: '#F3F6F8', padding: `${(hPx || 34) * 0.2}px ${(hPx || 34) * 0.34}px` }}>
        {word}
      </span>
    );
  }

  /* White cut only on dark grounds. Ink / plate / ink-forced → ink asset.
     No brightness(0) filter: the ink cut carries a black plate, white tick and
     black wordmark — flattening would erase the tick. */
  const useWhite = !plate && !ink && b.logoWhite;
  const img = (
    <img src={useWhite ? b.logoWhite : b.logo} alt={b.name + ' logo'} draggable={false}
         onError={() => setFailed(true)}
         className={plate || useWhite ? 'logo-ink' : (b.invert && !ink ? 'logo-white' : 'logo-ink')}
         style={{ height: boxH, width: boxW, objectFit: 'contain', flexShrink: 0 }} />
  );

  if (!plate) return img;
  const padBase = hPx || 34;
  return (
    <span className="inline-flex items-center justify-center rounded-lg shrink-0"
          style={{ background: '#F3F6F8', padding: `${Math.round(padBase * 0.22)}px ${Math.round(padBase * 0.3)}px`,
                   boxShadow: '0 2px 10px -2px rgba(0,0,0,0.5)' }}>
      {img}
    </span>
  );
}

/* `as` exists so the hero line can be the document's h1 without giving up the
   per-word reveal. It is the page's actual proposition, and the h1 is the most
   heavily weighted tag on it — spending that on a greeting was waste. */
function BlurText({ text, className, style, as: Tag = 'p' }) {
  const ref = useRef(null), [show, setShow] = useState(false);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) setShow(true); }, { threshold: 0.1 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return (
    <Tag ref={ref} className={className} style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em', ...style }}>
      {text.split(' ').map((w, i) => (
        /* The trailing space is deliberate and load-bearing. Word spacing here
           is margin, not whitespace, so without it the markup reads
           <span>Real</span><span>Estate</span> and any text extractor that
           strips tags — which is every AI crawler, none of which run CSS —
           gets "RealEstate...". A whitespace-only text node between flex items
           is never rendered, so the layout is untouched. */
        <React.Fragment key={i}>
          <motion.span style={{ display: 'inline-block', marginRight: '0.28em' }}
            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
            animate={show ? { filter: ['blur(10px)','blur(5px)','blur(0px)'], opacity: [0,0.5,1], y: [50,-5,0] } : {}}
            transition={{ duration: 0.7, times: [0,0.5,1], ease: 'easeOut', delay: (i * 100) / 1000 }}
          >{w}</motion.span>{' '}
        </React.Fragment>
      ))}
    </Tag>
  );
}

/* Is the fixed chrome currently sitting over a light section?
 *
 * The page alternates dark and light grounds, and the nav, wordmark and scroll
 * orb float above all of them. White type over the off-white intro or the white
 * services block simply disappears, so each of them asks this and swaps to dark
 * ink while it overlaps a section marked data-light.
 *
 * Measured against the element's own midline rather than its top edge, so the
 * flip happens when the bar is genuinely over the light panel. */
function useOverLight(elRef) {
  const [onLight, setOnLight] = useState(false);
  const { theme } = useTheme();
  useEffect(() => {
    const read = () => {
      const el = elRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const mid = r.top + r.height / 2;

      /* data-dark wins over everything. The hero keeps its black video in both
         modes, so chrome over it must stay white even in white mode — without
         this the nav went dark-on-black the moment the theme flipped. */
      for (const sec of document.querySelectorAll('[data-dark]')) {
        const b = sec.getBoundingClientRect();
        if (mid > b.top && mid < b.bottom) { setOnLight(false); return; }
      }

      /* White mode makes every other section light, so there is nothing left to
         detect. The per-section scan below is for dark mode, where Services is
         the one light island. */
      if (theme === 'light') { setOnLight(true); return; }
      let hit = false;
      for (const s of document.querySelectorAll('[data-light]')) {
        const b = s.getBoundingClientRect();
        if (mid > b.top && mid < b.bottom) { hit = true; break; }
      }
      setOnLight((prev) => (prev === hit ? prev : hit));
    };
    read();
    window.addEventListener('scroll', read, { passive: true });
    window.addEventListener('resize', read);
    return () => {
      window.removeEventListener('scroll', read);
      window.removeEventListener('resize', read);
    };
  }, [elRef, theme]);
  return onLight;
}

const SECTION_NAV = {
  top: '#top', intro: '#top', services: '#services', adreel: '#services',
  projects: '#projects', pricing: '#pricing', roadmap: '#roadmap',
  about: '#about', faq: '#faq', contact: '#contact',
};

function useActiveSection() {
  const [active, setActive] = useState('#top');
  useEffect(() => {
    const ids = Object.keys(SECTION_NAV);
    const read = () => {
      const line = window.innerHeight * 0.34;
      let cur = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (!el) continue;
        const r = el.getBoundingClientRect();
        if (r.top <= line) cur = id;        // last section to have started above the line
        if (r.top <= line && r.bottom > line) break;
      }
      /* The final section is usually shorter than the sightline offset, so it
         would never win on its own. At the bottom of the page it always has. */
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
        cur = ids[ids.length - 1];
      }
      const href = SECTION_NAV[cur] || '#top';
      setActive((prev) => (prev === href ? prev : href));
    };
    read();
    window.addEventListener('scroll', read, { passive: true });
    window.addEventListener('resize', read);
    return () => {
      window.removeEventListener('scroll', read);
      window.removeEventListener('resize', read);
    };
  }, []);
  return active;
}

/* True once the page has moved at all.
 *
 * The nav pill uses .liquid-glass, whose background is rgba(...,0.01) — for
 * practical purposes transparent, with a 4px blur behind it. Over the hero that
 * is the intent. Over a dense section like the ad reel there is nothing behind
 * the labels, so page content reads straight through the bar and the nav looks
 * broken. Once the page is scrolled the pill takes a real plate. */
function useScrolled(threshold = 8) {
  const [on, setOn] = useState(false);
  useEffect(() => {
    const read = () => setOn(window.scrollY > threshold);
    read();
    window.addEventListener('scroll', read, { passive: true });
    return () => window.removeEventListener('scroll', read);
  }, [threshold]);
  return on;
}

/* Below md the desktop pill is hidden and nothing replaced it — a phone visitor
   had no navigation at all, and no way to see where they were in a page that is
   mostly 300-500vh scroll tracks. This is that nav: a thumb-reachable bar
   pinned to the bottom, scrollable sideways because seven labels will not fit
   across 375px, and it auto-scrolls the active chip into view so the current

function MobileNav() {
  const active = useActiveSection();

       own scrollLeft keeps the effect local. */
    const target = chip.offsetLeft - (bar.clientWidth - chip.offsetWidth) / 2;

       crowded, and it leaves the lockup room to carry its tagline inside the

/* ═══════════ 2. INTRO — name, traced silhouette, typographic sweep ═══════════ */

/**
 * The name must run edge to edge. Rather than guess a vw value, measure the
 * rendered text once and scale the font size to the exact container width.
 */
/* Scales a single line of text so it spans its container exactly.
 *
 * Was FitHeading — dead code that still contained an <h1>, so any future use
 * would have quietly created a second one. Repurposed rather than deleted: the
 * measurement is exactly what the nav tagline needs to sit flush under the
 * wordmark from end to end, and no clamp() can do that because the target width
 * is another element's rendered size.
 *
 * Measure at a known size, then scale by the ratio — one reflow, not a search.
 * letter-spacing is in em, so it scales with the result and stays proportional.
 */
function FitWidth({ text, className, style, minPx = 0 }) {
  const wrapRef = useRef(null), textRef = useRef(null);
  useEffect(() => {
    const fit = () => {
      const wrap = wrapRef.current, el = textRef.current;
      if (!wrap || !el) return;
      el.style.fontSize = '100px';
      const w = el.scrollWidth;
      if (!w || !wrap.clientWidth) return;
      const size = 100 * (wrap.clientWidth / w);
      /* Exact fit and legibility part company on narrow screens: the wordmark is
         108px wide at 768px, and 22 characters inside that is 6.8px type. Below
         the floor the line is dropped rather than shrunk — an unreadable tagline
         is worse than none, and stretching it past the wordmark would break the
         alignment that is the point of fitting it. */
      wrap.style.display = size < minPx ? 'none' : 'block';
      el.style.fontSize = size + 'px';
    };
    fit();
    const ro = new ResizeObserver(fit);
    if (wrapRef.current) ro.observe(wrapRef.current);
    if (document.fonts) document.fonts.ready.then(fit);
    return () => ro.disconnect();
  }, [text]);
  return (
    <span ref={wrapRef} className="block w-full overflow-hidden">
      <span ref={textRef} className={className} style={{ whiteSpace: 'nowrap', display: 'block', ...style }}>{text}</span>
    </span>
  );
}

/* ── The typographic sweep ──
   Three statements, each broken by the figure: the phrase runs in from the left,
   stops at the silhouette, and picks up again on the far side. Line 1 is the
   longest and each one after it is shorter, so the block reads as a taper.
   Windows are sequential — a line only starts once the one above has landed. */
/**
 * The line a developer actually feels. Every agency pitch he has heard promises
 * leads; what he is buying is buyers, and he has been burned by the difference.
 * So: name the thing he already believes, then invert it, then ask for the call.
 * Plain words, no jargon, no metric that needs a footnote to make sense.
 *
 * Windows run alongside the trace, not after it — both finish together at 0.85.
 */
/**
 * The line a developer actually feels. Every agency pitch promises leads; what a
 * developer is buying is buyers, and they have been burned by the difference.
 * Name what they already believe, invert it, then ask for the call.
 *
 * Line 1 is the headline act — full width above the figure, on ruled paper, so it
 * lands like something written down rather than another dark-on-dark banner.
 * Lines 2 and 3 break around the figure and step down in size beneath it.
 */
/* Left half of a line fills over the first half of its window, right half over
   the second — so one continuous sweep crosses the figure. */
function sweepClip(p, from, to, half) {
  const t = Math.max(0, Math.min(1, (p - from) / (to - from)));
  const local = half === 0 ? Math.min(1, t / 0.5) : Math.max(0, (t - 0.5) / 0.5);
  return { clipPath: `inset(0 ${((1 - local) * 100).toFixed(2)}% 0 0)`, opacity: local > 0 ? 1 : 0 };
}

/* ── The ad platforms, pinned either side of the figure ──
   Marks only, no labels, pulled in close to the figure and rendered entirely in
   white. Seven different brand palettes against a near-black page fought each
   other and pulled attention off the headline; one ink keeps the cluster reading
   as a single row of capability and lets the figure stay the focal point. */

/* Marks live in two horizontal bands the copy never enters — one above the
   shoulder line, one below the last line of type. Keeping them out of the text's
   vertical range is the only reliable way to guarantee clearance: the phrases are
   long enough that there is no outer column wide enough to hold a mark beside
   them at 1440px. */
/* ═══════════ 2. INTRO — name split around the figure ═══════════
 *
 * Rebuilt against the reference composition: a script "Hi, I'm", the name in
 * two very large grotesque words set either side of the head, and the figure
 * scaled up to carry the frame. The first name sits BEHIND the cutout and the
 * surname in FRONT, which is what gives the layering its depth — a flat stack
 * of centred text reads as a caption, this reads as a portrait.
 *
 * What went: the brush-stroke band and the "I make it come / back as buyers"
 * sweep. One statement replaces both, which also removes the two scroll windows
 * that used to drive them.
 *
 * The figure is the coordinate system, as before — every piece is positioned
 * from its width or its top edge, so the composition holds together at any
 * viewport instead of being retuned per breakpoint.
 */
/* ═══════════ 2. INTRO — the portrait plate ═══════════
 *
 * Built to the supplied mockup: warm off-white ground, the full name set very
 * large in two words either side of the head, a script "Hey, I'm" tucked under
 * the first, proof bottom-left and the call bottom-right.
 *
 * The layering is what carries it. "V. Sai" sits BEHIND the cutout so the hair
 * crops its tail; "Kavshik" sits IN FRONT, crossing the jaw and shoulder. Flat
 * centred type would read as a caption — this reads as a plate.
 *
 * `data-light` marks the section for the fixed chrome: the nav and the scroll
 * orb both read it and flip to dark ink while they are over it, otherwise white
 * type on white ground would simply disappear.
 *
 * Vertical positions are fractions of the figure height and horizontal ones are
 * viewport insets, so the composition holds without per-breakpoint retuning.
 */
/* Phone-width branch, read from matchMedia rather than guessed from a class,
   because a couple of decisions in the light intro depend on it in JS. */
function useIsPhone() {
  const [phone, setPhone] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 767px)');
    const read = () => setPhone(mq.matches);
    read();
    mq.addEventListener('change', read);
    return () => mq.removeEventListener('change', read);
  }, []);
  return phone;
}

/* Publishes the bottom band's measured height to the stage as --intro-bot.
 *
 * The figure is sized from the space left between the fixed nav and this band,
 * and the band's height is not something a clamp can express: it is three lines
 * of statement at 1440 and two at 1920, plus a call whose padding scales with
 * the viewport. Guessing it left the figure overlapping the statement by 31px on
 * a laptop and short by 50px on a desktop.
 *
 * Safe from feedback because nothing the band contains is sized from --fig-w —
 * the statement's width cap is deliberately written against a static bound for
 * exactly this reason. */
function useBandHeight(stageRef, bandRef) {
  useEffect(() => {
    const publish = () => {
      const stage = stageRef.current, band = bandRef.current;
      if (!stage || !band) return;
      stage.style.setProperty('--intro-bot', Math.round(band.offsetHeight) + 'px');
    };
    publish();
    const ro = new ResizeObserver(publish);
    if (bandRef.current) ro.observe(bandRef.current);
    /* Webfonts land after first paint and change the line count. */
    if (document.fonts) document.fonts.ready.then(publish);
    return () => ro.disconnect();
  }, []);
}

/* ═══════════ INTRO SIGN-OFF — typed statement, then the signature ═══════════
 *
 * The statement used to be a static block of display type sitting in the bottom
 * band. It now types itself as the section scrolls and is signed underneath,
 * which turns the claim into something that reads as authored rather than
 * asserted — appropriate for a one-person practice whose whole position is that
 * every claim is checkable.
 *
 * On the signature being SVG rather than the supplied PNG: a raster image cannot
 * be drawn. The signing effect is stroke-dashoffset walking a path from its full
 * length down to zero, which needs vector geometry — so the mark is authored as
 * paths here. It is shaped to the supplied reference: a tall looping K, the
 * remainder in one connected script run, a long underline sweep beneath, and the
 * two trailing dots.
 */

/* Typed one character at a time, then the trailing dots land in sequence so the
   line finishes on a beat rather than just stopping. The exclamation is part of
   the typed string; the dots are separate because they animate after it. */
function TypedStatement({ t, className, style }) {
  const TEXT = 'We don’t just run ads, we build category winners!';
  const clamped = Math.max(0, Math.min(1, t));

  /* Reserve the last fifth of the window for the dots. */
  const typeT = Math.min(1, clamped / 0.8);
  const dotsT = Math.max(0, (clamped - 0.8) / 0.2);

  const n = Math.round(typeT * TEXT.length);
  const typing = n > 0 && n < TEXT.length;
  const dots = Math.round(dotsT * 3);

  /* A hidden twin of the finished line holds the box open from the start.
     Without it the paragraph grows from one line to five as it types, which
     grows the bottom band, which changes the measured --intro-bot, which
     resizes the figure — 119px of portrait movement on a laptop, driven
     entirely by text reflow. The twin and the live text share one grid cell,
     so the box is always the finished line's size and nothing below reflows. */
  return (
    <p className={className} style={style} aria-label={TEXT + '...'}>
      <span className="tw-reserve" aria-hidden="true">{TEXT}...</span>
      <span className="tw-live">
        <span aria-hidden="true">{TEXT.slice(0, n)}</span>
        {/* Rendered only while there is still text to come. Setting opacity
            would not work: .tw-caret animates opacity, and a CSS animation wins
            over an inline style for the property it animates. */}
        {typing && <span className="tw-caret" aria-hidden="true"
                         style={{ marginLeft: '0.06em' }}>|</span>}
        <span aria-hidden="true" style={{ letterSpacing: '0.14em' }}>
          {'.'.repeat(dots)}
        </span>
      </span>
    </p>
  );
}

/* ═══════════ INTRO — the Sevora card ═══════════
 *
 * Rebuilt to the supplied reference: one large rounded card, a serif headline
 * whose last word drops to grey, subtext, two buttons, a three-stat row, and a
 * monochrome portrait bleeding to the card's right edge with a glass
 * availability card floating over it. A live platform strip runs beneath.
 *
 * Both modes share this build — the reference is light, so dark mode inherits
 * the same geometry through the palette tokens rather than forking the markup.
 *
 * The typed statement and the drawn signature from the previous pass are kept.
 * They were built for the old bottom band, which this replaces, so they move
 * into the card's left column where the reference has its supporting copy. The
 * work is not discarded, it is rehoused.
 *
 * The portrait is desaturated in CSS rather than as a second asset: one file,
 * and the treatment can be tuned without a round trip through an image editor.
 */

/* Every surface QDnCo actually runs on, plus the tools the work is made with.
   Each entry is the brand's own mark, traced or supplied — no stand-ins. */
/* `treat` is not a style choice — it is the output of
   `node classify-platform-marks.mjs`, which measures each mark's contrast
   against both page grounds and flags the ones that camouflage:

     leave   already contrasts on both grounds; ships exactly as the brand
             draws it (Meta blue 3.7/5.2, Claude orange 6.2/3.1, Ads blue 5.5/3.6)
     dark    near-BLACK artwork, invisible on the dark page -> inverted there
     white   near-WHITE artwork, invisible on the white page -> inverted there.
             X and Gemini both ship white; an earlier pass had these backwards
             because the classifier was discarding white as "background".
     light   light but chromatic, so inverting would change the hue -> darkened
             on white instead. Snapchat yellow measures 1.10:1 there, the worst
             in the set.
     ink     drawn in currentColor, so it simply follows the theme */
const PLATFORM_STRIP = [
  { n: 'Meta Ads',      f: 'meta-c.svg',       treat: 'leave' },
  { n: 'Google Ads',    f: 'googleads-c.svg',  treat: 'leave' },
  { n: 'Google Gemini', f: 'googlegemini.svg', treat: 'white' },
  { n: 'Snapchat Ads',  f: 'snapchat-c.svg',   treat: 'light' },
  { n: 'X Ads',         f: 'x-c.svg',          treat: 'white' },
  { n: 'Claude',        f: 'claude.svg',       treat: 'leave' },
  { n: 'Cursor',        f: 'cursor.svg',       treat: 'dark'  },
  { n: 'Codex',         f: 'codex.svg',        treat: 'dark'  },
  { n: 'Higgsfield',    f: 'higgsfield.svg',   treat: 'dark'  },
];

/* Inlined rather than loaded as a file: an <img> renders its SVG in a separate
   document where currentColor has nothing to inherit from, so a currentColor
   mark only follows the theme when it is inline in the page. */
const INTRO_STATS = [
  { v: '32+',   k: 'Reported engagements' },
  { v: '₹37Cr', k: 'Reported pipeline' },
  { v: '51%',   k: 'Leads sales-ready' },
];

/* The signature, revealed by a sweep across the real artwork.
 *
 * This replaces a hand-drawn SVG approximation. The supplied scan is a bitmap,
 * and a bitmap cannot be stroke-drawn — stroke-dashoffset needs vector
 * geometry. Tracing it yields filled outlines, so "drawing" it would trace the
 * edge of each stroke rather than the stroke itself, which reads wrong.
 *
 * A masked sweep along the writing direction is the honest alternative: the
 * genuine mark, revealed the way a hand crosses the page. The gradient is
 * angled slightly off horizontal to follow the signature's own rising baseline
 * and carries a soft mid-stop, so the leading edge reads as a nib rather than
 * a hard wipe.
 *
 * The asset is black on transparent and inverted for the dark ground, so one
 * file serves both themes. */
function SignatureMark({ t }) {
  const p = Math.max(0, Math.min(1, t));
  /* Overshoots at both ends so the mark is fully hidden at 0 and fully shown
     at 1, rather than starting half-revealed. */
  const head = p * 122 - 11;
  const mask = `linear-gradient(101deg,` +
               ` #000 ${head - 10}%,` +
               ` rgba(0,0,0,0.45) ${head}%,` +
               ` rgba(0,0,0,0) ${head + 6}%)`;
  return (
    <img src="/signature.png" alt="Signed, V. Sai Kavshik" draggable={false}
         className="intro-sign-img"
         style={{ WebkitMaskImage: mask, maskImage: mask }} />
  );
}

function IntroCard() {
  const ref = useRef(null);
  const scrollP = useSectionProgress(ref);
  const phone = useIsPhone();
  /* Phone playhead. Desktop scrubs the reveal purely from scroll, which works
     because a wheel gesture keeps moving through the pin. On a phone the same
     code path lands the reader on a fully blank card at progress 0 — the plate
     is visible, every child is opacity 0 — and a thumb lift leaves them staring
     at an empty frame that looks broken. When the stage pins, this playhead
     drives the same cues the scroll would have, so the portrait slides in from
     the right and the copy rises exactly as on desktop. Scroll still wins via
     Math.max, so a fast flick can scrub ahead of the playhead, and the empty
     final quarter of the track remains the micro-pause before release. */
  const [playP, setPlayP] = useState(0);

  useEffect(() => {
    if (!phone) { setPlayP(0); return; }
    let started = false;
    let raf = 0;
    const DUR = 1800;
    const TARGET = 0.82;   /* covers the 0.74 animation span + a beat of settle */

    const tick = (t0) => (now) => {
      const u = Math.min(1, (now - t0) / DUR);
      const e = 1 - Math.pow(1 - u, 3);          /* cubic ease-out — same feel as the portrait slide */
      setPlayP(e * TARGET);
      if (u < 1) raf = requestAnimationFrame(tick(t0));
    };

    const onScroll = () => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      /* Left the stage — reset so a later re-entry plays again. */
      if (r.top > 80) {
        if (started) {
          started = false;
          cancelAnimationFrame(raf);
          setPlayP(0);
        }
        return;
      }
      if (started) return;
      /* Sticky is engaged when the section top has reached the viewport top and
         the section still fills the screen below. That is the moment the blank
         plate would otherwise hold. */
      if (r.top <= 1 && r.bottom > window.innerHeight * 0.6) {
        started = true;
        raf = requestAnimationFrame(tick(performance.now()));
      }
    };

    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      window.removeEventListener('scroll', onScroll);
      cancelAnimationFrame(raf);
    };
  }, [phone]);

  const p = phone ? Math.max(scrollP, playP) : scrollP;

  /* On a phone every cue is packed into the first three-quarters of the track
     and the last quarter is left empty on purpose. The card used to finish
     animating at 0.96, which meant the reader arrived at the settled composition
     and the section released at almost the same moment — so on a fast scroll the
     whole thing played to an empty seat. Ending early buys a beat where
     everything is present and still, and the remaining scroll is the single
     small push that carries them out. The track is lengthened to match, so the
     beat is real time rather than borrowed from the animation. */
  const span = phone ? 0.74 : 1;
  const ramp = (from, to) => Math.max(0, Math.min(1, (p - from * span) / ((to - from) * span)));
  const rise = (t) => ({ opacity: t, transform: `translateY(${(1 - t) * 26}px)` });

  /* The portrait enters from the right rather than rising with the copy: it is
     the one element anchored to that edge, so sliding it in along its own axis
     reads as the figure taking its place instead of the whole card assembling
     at once. Eased rather than linear — a linear slide driven by raw scroll
     progress looks mechanical, and the ease-out settles it at the end.
     Theme-independent, so both grounds get the identical move. */
  const slideInRight = (t) => {
    const e = 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);   // cubic ease-out
    return {
      opacity: e,
      transform: `translateX(${(1 - e) * 88}px) scale(${0.965 + 0.035 * e})`,
      willChange: e < 1 ? 'transform, opacity' : 'auto',
    };
  };

  return (
    <section id="intro" ref={ref} className="relative track-intro"
             style={{ height: phone ? '270vh' : '190vh', background: 'var(--page)' }}>

      {/* Anchored to the top on a phone rather than centred. Centring splits any
          overflow evenly, so a card fractionally taller than the frame loses the
          top of the portrait behind the fixed bar — the one place the overflow
          must never go. Set inline because the flex utilities are inline too and
          a stylesheet rule cannot reliably outrank them here. */}
      <div className="sticky top-0 h-screen overflow-hidden flex flex-col justify-center
                      px-4 sm:px-6 md:px-10"
           style={{ paddingTop: 'calc(var(--chrome-clear) + clamp(0.5rem, 2vh, 1.5rem))',
                    paddingBottom: 'clamp(1rem, 3vh, 2rem)',
                    justifyContent: phone ? 'flex-start' : 'center' }}>

        {/* ── The card ── */}
        <motion.div {...fadeOnly(0.1)} className="intro-card relative mx-auto w-full overflow-hidden"
                    style={{ maxWidth: 'var(--content-max)' }}>

          <div className="intro-card-grid">
            {/* ── Left column ── */}
            <div className="intro-card-copy">
              <h2 className="intro-card-title" style={rise(ramp(0.02, 0.22))}>
                Clear inventory,{' '}
                <span style={{ color: 'rgba(var(--ink-rgb),0.42)' }}>faster</span>
              </h2>

              <p className="intro-card-sub" style={rise(ramp(0.08, 0.30))}>
                I&apos;m V. Sai Kavshik. I run performance marketing for Bangalore developers —
                research first, then spend, never the reverse.
              </p>

              <div className="intro-card-btns" style={rise(ramp(0.14, 0.36))}>
                <a href="#projects" className="intro-btn intro-btn-solid">See the work</a>
                <a href="#contact" className="intro-btn intro-btn-ghost">Get in touch</a>
              </div>

              {/* Stats land one after another rather than together, so the row
                  reads left to right the way it would be spoken. */}
              <div className="intro-card-stats">
                {INTRO_STATS.map((s, i) => (
                  <div key={s.k} style={rise(ramp(0.22 + i * 0.05, 0.44 + i * 0.05))}>
                    <div className="intro-stat-v">{s.v}</div>
                    <div className="intro-stat-k">{s.k}</div>
                  </div>
                ))}
              </div>


              {/* Foot of the copy column. The stats left real space here, and
                  the right column needs every pixel of its height for the
                  portrait — which is what the reduction was costing before. */}
              <div className="intro-card-signoff">
                <TypedStatement t={ramp(0.44, 0.74)} className="intro-card-typed" style={{}} />
                <div className="intro-card-sign">
                  <SignatureMark t={ramp(0.72, 0.96)} />
                </div>
              </div>
            </div>

            {/* ── Right column: the portrait, bleeding to the card edge ──
                Large again, but contained rather than cover-cropped, so it is
                full size AND whole — the small floating version fixed the crop
                by giving up 57% of the height and leaving 162px of dead space
                beside it. */}
            <div className="intro-card-right">
              <div className="intro-card-figure" style={slideInRight(ramp(0.02, 0.30))}>
                <img src="/portrait-cutout.png" alt="V. Sai Kavshik" draggable={false} />

                {/* Floating over the portrait, as the reference has it. It
                    costs no column height there, which is what lets the figure
                    stay full size. */}
                <motion.div className="intro-avail" style={rise(ramp(0.20, 0.42))}>
                  <div className="intro-avail-copy">
                    <p className="intro-avail-eyebrow">Phase 0</p>
                    <p className="intro-avail-title">Available for engagements</p>
                  </div>
                  <a href="#contact" className="intro-avail-btn" aria-label="Get in touch">
                    <ArrowUpRight className="h-4 w-4" />
                  </a>
                </motion.div>
              </div>
            </div>
          </div>
        </motion.div>

      </div>
    </section>
  );
}

/**
 * The surfaces the work runs on, and the tools it is made with.
 *
 * Lives under the ad reel rather than under the intro card: after a row of
 * finished creative, "what is this built with" is the next question. Beneath
 * the portrait it read as decoration under a headshot.
 *
 * The ends are masked, not overlaid. Painting a gradient over a surface that
 * already has a colour doubles the tint and shows as a band; masking removes
 * only the marquee's own pixels, so the section reads straight through.
 */
function PlatformStrip() {
  return (
    <motion.div initial={{ opacity: 0 }} whileInView={{ opacity: 1 }}
                viewport={{ once: true, amount: 0.3 }} transition={{ duration: 0.7 }}
                className="intro-strip relative z-10 mx-auto w-full"
                style={{ maxWidth: 'var(--content-max)' }}>
      <div className="relative w-full overflow-hidden edge-fade">
        <div className="platform-track flex w-max items-center">
          {[...PLATFORM_STRIP, ...PLATFORM_STRIP].map((pl, i) => (
            <span key={`${pl.n}-${i}`} className="intro-plat">
              <img src={`/brands/platforms/${pl.f}`} alt="" aria-hidden="true"
                   className={`plat-${pl.treat}`} />
              <span>{pl.n}</span>

    </motion.div>
  );
}

     The earlier IntroLight/IntroDark pair this supersedes has been removed. */

/**
 * Section scroll progress from a plain passive listener rather than a
 * rAF-driven motion value. Two reasons: it keeps advancing even when the
 * browser throttles animation frames (backgrounded tab, reduced power), and it
 * is a plain number, so the bar fill and the milestone highlight can never
 * drift out of sync with each other.
 *
 * Bucketed to 1/1000 so a flick of the wheel can't cause a re-render storm.
 */
function useSectionProgress(ref) {
  const [p, setP] = useState(0);
  useEffect(() => {
    let last = -1;
    const read = () => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      const budget = r.height - window.innerHeight;
      const raw = budget > 0 ? -r.top / budget : 0;
      const q = Math.round(Math.max(0, Math.min(1, raw)) * 1000);
      if (q !== last) { last = q; setP(q / 1000); }
    };
    read();
    window.addEventListener('scroll', read, { passive: true });
    window.addEventListener('resize', read);
    return () => {
      window.removeEventListener('scroll', read);
      window.removeEventListener('resize', read);
    };
  }, [ref]);
  return p;
}

/**
 * Hands the wheel back to the page when an inner scroller is exhausted.
 *
 * Browsers do chain overflow scrolling to the document eventually, but Chrome
 * and Firefox "latch" a continuous gesture to whichever element it started on:
 * once the pointer is over a scrollable panel, the rest of that gesture belongs
 * to the panel even after it hits its own end stop. Inside a sticky-pinned
 * track that reads as a dead end — the card stops moving, the page stops
 * moving, the scroll orb stops turning, and the only way out is to move the
 * pointer off the card and start a fresh gesture.
 *
 * So the end stop is detected here and the remaining delta is applied to the
 * window by hand. Scrolling through a card now runs straight on into the next
 * one, and because the page really is scrolling, everything driven by
 * window.scrollY — the phase rail, the ignition bar, the orb — keeps moving
 * with it.
 */
function useScrollChain(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    /* Positive delta means downward. `slack` absorbs the sub-pixel scrollTop
       that fractional zoom and high-DPI displays leave behind, which otherwise
       makes "at the bottom" never quite true. */
    const exhausted = (delta) => {
      const max = el.scrollHeight - el.clientHeight;
      /* Not a scroller at this size — the light variant of the panel never is.
         Stay out of the way entirely rather than preventDefault-ing a gesture
         the browser would have handled natively and more smoothly. */
      if (max <= 1) return false;
      const slack = 1.5;
      return delta > 0 ? el.scrollTop >= max - slack : el.scrollTop <= slack;
    };

    const onWheel = (e) => {
      if (!e.deltaY || !exhausted(e.deltaY)) return;
      e.preventDefault();
      /* deltaMode 1 is lines, 2 is pages — normalise both to pixels. */
      const px = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * window.innerHeight : e.deltaY;
      window.scrollBy(0, px);
    };

    /* Touch latches the same way, and there is no delta on the event, so the
       gesture distance is tracked between moves. */
    let y = 0;
    const onTouchStart = (e) => { y = e.touches[0].clientY; };
    const onTouchMove = (e) => {
      const cur = e.touches[0].clientY;
      const delta = y - cur;                        // finger up = scroll down
      y = cur;
      if (!delta || !exhausted(delta)) return;
      e.preventDefault();
      window.scrollBy(0, delta);
    };

    el.addEventListener('wheel', onWheel, { passive: false });
    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: false });
    return () => {
      el.removeEventListener('wheel', onWheel);
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
    };
  }, [ref]);
}

/* Char-by-char reveal driven by the same plain progress number. */
function AnimatedText({ text, p, from, to, className, style }) {
  const chars = text.split('');
  const span = to - from;
  const t = Math.max(0, Math.min(1, (p - from) / span));
  const head = t * chars.length;
  return (
    <p className={className} style={style}>
      {chars.map((c, i) => (
        /* The dim level is a token: 0.2 of near-white on black still reads, but
           0.2 of near-black on white is almost paper. */
        <span key={i} style={{ opacity: i < head ? 1 : 'var(--reveal-dim)', transition: 'opacity 220ms linear' }}>{c}</span>
      ))}
    </p>
  );
}

/* The Mux HLS stream behind the carousel.
 *
 * hls.js is needed everywhere except Safari, which plays HLS natively — so the
 * component tries the library first and falls back to a plain src. Both paths
 * are guarded: if the script has not loaded, or the network refuses the
 * manifest, the section simply renders on its own background rather than
 * breaking. It is decoration, so it must never be load-bearing.
 */
function HlsVideo({ src, className, style }) {
  const ref = useRef(null);
  useEffect(() => {
    const video = ref.current;
    if (!video) return;
    const Hls = window.Hls;
    if (Hls && Hls.isSupported()) {
      const hls = new Hls({ capLevelToPlayerSize: true });
      hls.loadSource(src);
      hls.attachMedia(video);
      return () => hls.destroy();
    }
    if (video.canPlayType('application/vnd.apple.mpegurl')) video.src = src;
  }, [src]);
  return (
    <video ref={ref} autoPlay loop muted playsInline aria-hidden="true"
           className={className} style={style} />
  );
}

 *
 * Scroll drives it, not buttons. Section progress picks the active card; every
 * other card takes a role from its signed distance to that card, so scrolling
 * back walks the whole arrangement backwards without any extra state. That is
 * the only way the reverse can be exact — an animation queue would drift out of
 * step the moment someone scrolls up mid-transition.
 *
 * Roles: 0 is front and sharp, ±1 are the flanks, anything further is stacked
 * behind centre and blurred out. Positions are percentages of the stage, so the
 * shape holds from a phone to a 4K panel.
 */
function ServiceCarousel({ p, light }) {
  const N = SERVICE_CARDS.length;
  const active = Math.min(N - 1, Math.floor(p * N * 0.999));
  const phone = useIsPhone();
  /* Open by default: the detail is the point of the card, and making someone
     press a control to reach it costs more attention than it saves space. The
     button now collapses rather than reveals. Each card opens as it reaches the
     front, so a card that has scrolled away is not left expanded behind. */
  const [open, setOpen] = useState(0);
  useEffect(() => { setOpen(active); }, [active]);

  /* Signed shortest distance, so card 0 sits beside card 4 rather than four
     places away — the wrap has to be seamless in both directions. */
  const rel = (i) => {
    let d = i - active;
    if (d > N / 2) d -= N;
    if (d < -N / 2) d += N;
    return d;
  };

  const roleStyle = (d) => {
    const side = d < 0 ? -1 : 1;
    if (d === 0) {
      return { left: '50%', transform: `translateX(-50%) scale(${phone ? 1 : 1.04})`,
               filter: 'blur(0px)', opacity: 1, zIndex: 20 };
    }
    if (Math.abs(d) === 1) {
      return { left: phone ? `${50 + side * 46}%` : `${50 + side * 34}%`,
               transform: 'translateX(-50%) scale(0.74)',
               filter: 'blur(2px)', opacity: 0.7, zIndex: 10 };
    }
    return { left: '50%', transform: `translateX(-50%) translateX(${side * 8}px) scale(0.56)`,
             filter: 'blur(5px)', opacity: 0.38, zIndex: 5 };
  };

  /* Touch swipe, expressed as scroll rather than as a second source of truth.
     The stage is pinned and the active card is a function of scroll progress, so
     a swipe that moved a local index would immediately be overruled the next
     time the page moved a pixel. Advancing the page by one card's share of the
     track instead means the swipe drives the same value everything else reads —
     card, dots and video stay in agreement, and the gesture is undoable by
     scrolling back.

     The section is 250vh with 100vh pinned in place, so the progress that
     selects a card is spread across the remaining 150vh: one card is 30vh. */
  const swipeRef = useRef(null);
  useEffect(() => {
    const el = swipeRef.current;
    if (!el) return;
    let x0 = 0, y0 = 0, tracking = false;

    const start = (e) => {
      if (e.touches.length !== 1) { tracking = false; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; tracking = true;
    };
    const end = (e) => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - x0, dy = t.clientY - y0;
      /* Vertical-dominant gestures are the page scrolling past, not a swipe. */
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      const step = window.innerHeight * 0.3;
      window.scrollBy({ top: dx < 0 ? step : -step, behavior: 'smooth' });
    };

    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchend', end, { passive: true });
    return () => {
      el.removeEventListener('touchstart', start);
      el.removeEventListener('touchend', end);
    };
  }, []);

  return (
    /* pan-y, not none: the section is still a scrolling page and taking vertical
       gestures away from it would trap the reader on this screen. */
    <div ref={swipeRef} className="relative w-full"
         style={{ height: phone ? 420 : 470, touchAction: 'pan-y' }}>
      {SERVICE_CARDS.map((c, i) => {
        const d = rel(i);
        const front = d === 0;
        return (
          <article key={c.n}
                   aria-hidden={front ? undefined : 'true'}
                   className="absolute top-0"
                   style={{
                     width: phone ? 'min(84vw, 340px)' : 'min(34vw, 430px)',
                     ...roleStyle(d),
                     /* only the front card takes clicks — a blurred neighbour
                        swallowing a tap on the dropdown is worse than no tap */
                     pointerEvents: front ? 'auto' : 'none',
                     transition: 'left 650ms cubic-bezier(0.4,0,0.2,1), transform 650ms cubic-bezier(0.4,0,0.2,1), filter 650ms cubic-bezier(0.4,0,0.2,1), opacity 650ms cubic-bezier(0.4,0,0.2,1)',
                     willChange: 'transform, filter, opacity, left',
                   }}>
            {/* The drift lives here, one level in. On the positioned element its
                keyframes would overwrite the carousel's own transform. */}
            <div className={front ? 'card-float' : 'card-float-b'}>
              <ServiceCard c={c} front={front} light={light} phone={phone}
                           open={open === i} onToggle={() => setOpen(open === i ? null : i)} />
            </div>
          </article>
        );
      })}

      {/* which card of five, so the scroll has a readable position */}
      <div className="absolute inset-x-0 -bottom-2 flex justify-center gap-1.5" aria-hidden="true">
        {SERVICE_CARDS.map((c, i) => (
          <span key={c.n} className="rounded-full"
                style={{ width: i === active ? 22 : 6, height: 6,
                         background: i === active ? 'rgba(var(--ink-rgb),0.9)' : 'rgba(var(--ink-rgb),0.32)',
                         transition: 'width 400ms ease, background-color 400ms ease' }} />
        ))}
      </div>
    </div>
  );
}

  /* The sector name and nothing else. The count-and-note strip that used to sit

     stray caption between two cards, so the break is now purely the title. */

    <div ref={ref} className="group-break">

            <ProjectCard key={p.n} p={p} i={idx} total={TOTAL_PROJECTS} progress={scrollYProgress} />
          ); })}
        </div>
      ))}
    </section>
  );
}

/* ═══════════ ROADMAP — the site build ═══════════
 *
 * Modelled directly on the supplied reference clip, phase for phase:
 *
 *   1  bare dirt plot in a low-poly city, cyan survey grid pegged out on it
 *   2  the grid extrudes into a full-height cyan hologram of the tower;
 *      the plot is levelled to a grey pad and lorries arrive on the roads
 *   3  grey concrete columns stand up, first slabs land, tower cranes appear
 *   4  red brick infill climbs floor by floor behind the slab bands
 *   5  blue glazing rises bottom-up over the brick
 *   6  finished glass tower with white mullion fins, crown and podium;
 *      the cranes have gone, traffic and trees are back
 *
 * Palette is sampled from the clip rather than invented: tan dirt, pastel
 * neighbours, #3FC9F5 blueprint cyan, concrete greys, #C4604A brick, blue-green
 * glass, grey-and-yellow cranes.
 *
 * The previous version drifted below the fold because the SVG had overflow
 * visible and a viewBox that did not actually contain the geometry. Here the
 * viewBox is derived from the world extents and the scene is meet-fitted, so
 * the whole build is inside the frame at every viewport by construction.
 */

const ISO_X = 0.866, ISO_Y = 0.5;
const iso = (x, y, z) => [(x - y) * ISO_X, (x + y) * ISO_Y - z];
const pt = (x, y, z) => iso(x, y, z).map((n) => n.toFixed(1)).join(',');

/* Three visible faces of a cuboid, each returned separately so it can take its
   own shade — that shading is the whole illusion of solidity. */
function box(x, y, z, w, d, h) {
  return {
    top: [pt(x, y, z + h), pt(x + w, y, z + h), pt(x + w, y + d, z + h), pt(x, y + d, z + h)].join(' '),
    left: [pt(x, y + d, z), pt(x + w, y + d, z), pt(x + w, y + d, z + h), pt(x, y + d, z + h)].join(' '),
    right: [pt(x + w, y, z), pt(x + w, y + d, z), pt(x + w, y + d, z + h), pt(x + w, y, z + h)].join(' '),
  };
}

/* Sampled from the reference. Each solid gets a top / left / right triple. */
const C = {
  dirt: ['#C2A277', '#A98A61', '#8E7350'],
  pad: ['#D5D2CB', '#B3B0A9', '#918E88'],
  conc: ['#D8D5CE', '#B0ADA6', '#8D8A84'],
  slab: ['#CFCCC4', '#A8A59E', '#87847E'],
  brick: ['#C4604A', '#A54B38', '#8C3E2E'],
  glass: ['#A8D4EA', '#5E93B8', '#3C6B8C'],
  podium: ['#E4E1DA', '#BFBCB5', '#9B988F'],
  road: '#6C7176',
  line: '#E8E6E0',
  cyan: '#3FC9F5',
  cyanHi: '#9CEBFF',
  craneMast: '#C9CCD1',
  craneJib: '#E8B830',
  truck: '#EDE9E1',
  truckHot: '#D2453C',
  /* Blackened cast metal. Three values for the three facings, a warm-grey
     highlight for the leading wing edge, and a lighter beak so the head reads
     at 20 pixels. */
  eagleDk: '#14161A',
  eagleMd: '#26292F',
  eagleLt: '#3C4149',
  eagleHi: '#8A9099',
  eagleBeak: '#6E747D',
  tree: '#59A05C',
  treeDark: '#3F7A45',
  crew: '#F2C14E',
};

const N_FLOORS = 11;
const FH = 13;                 // storey height
const FW = 54;                 // tower footprint
const PLOT = 132;              // plot the tower stands on
const TOP_Z = N_FLOORS * FH;

const SITE_STAGES = [
  { id: '00', tag: 'Site survey', gate: 'pre', dur: '~2 weeks',
